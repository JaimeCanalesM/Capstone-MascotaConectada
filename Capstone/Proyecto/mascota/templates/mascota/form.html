{% extends "base.html" %}
{% block titulo %}{{ object.pk|yesno:"Editar mascota,Nueva mascota" }}{% endblock %}
{% block contenido %}
<h1 class="h4 mb-3">{{ object.pk|yesno:"Editar mascota,Nueva mascota" }}</h1>
<form method="post" enctype="multipart/form-data">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Guardar</button>
  <a class="btn btn-outline-secondary" href="{% url 'mascota:lista' %}">Cancelar</a>
</form>
{% endblock %}
