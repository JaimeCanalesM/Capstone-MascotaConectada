{% extends "base.html" %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block contenido %}
<div class="container mt-4" style="max-width: 480px;">
  <h1 class="h4 mb-3">Define tu nueva contraseña</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-success w-100" type="submit">Guardar</button>
    </form>
  {% else %}
    <div class="alert alert-danger">El enlace no es válido o ya fue utilizado.</div>
    <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary">Solicitar nuevo enlace</a>
  {% endif %}
</div>
{% endblock %}
